server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    location /rest/ {
        # Read-only views plus explicitly granted transactional RPCs.
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
        proxy_hide_header Access-Control-Allow-Origin;
    }
    location /engine/ {
        proxy_pass http://backend:8000/;
        proxy_read_timeout 180s;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
