name: debate-room
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: debate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-db-password}
      WEB_DB_PASSWORD: ${WEB_DB_PASSWORD:-local-web-password}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:-local-worker-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d debate]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  rest:
    image: postgrest/postgrest:v12.2.8
    environment:
      PGRST_DB_URI: postgres://web_auth:${WEB_DB_PASSWORD:-local-web-password}@db:5432/debate
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: web_user
      PGRST_DB_MAX_ROWS: 1000
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  worker-rest:
    image: postgrest/postgrest:v12.2.8
    environment:
      PGRST_DB_URI: postgres://worker_auth:${WORKER_DB_PASSWORD:-local-worker-password}@db:5432/debate
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: worker_user
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  ollama:
    image: ollama/ollama:0.6.8
    environment:
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_KEEP_ALIVE: 2m
    volumes:
      - ollama_data:/root/.ollama
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-4g}
    restart: unless-stopped
  model-init:
    image: ollama/ollama:0.6.8
    environment:
      OLLAMA_HOST: http://ollama:11434
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen2.5:3b}
    entrypoint: [/bin/sh, -c]
    command:
      - 'until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull "$${DEFAULT_MODEL}"'
    depends_on: [ollama]
    restart: on-failure
  backend:
    build: ./backend
    environment:
      POSTGREST_URL: http://worker-rest:3000
      OLLAMA_URL: http://ollama:11434
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:1234/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_TIMEOUT: '120'
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on: [worker-rest, ollama]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  web:
    image: nginx:1.27-alpine
    ports:
      - '127.0.0.1:${PORT:-8080}:80'
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [rest, backend]
    restart: unless-stopped
volumes:
  postgres_data:
  ollama_data:
